{% extends 'catalog/base.html'%}
{% block content %}
<div class="container">
    <div class="row">
        <form class="row" method="post" enctype="multipart/form-data">
            <div class="col-6">
                <div class="card">
                    {% if object %}
                    <p class="card-text">Редактирование категории</p>
                        {% else %}
                    <p class="card-text">Создание категории</p>
                        {% endif %}
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    {% if object %}
                        Сохранить изменения
                    {% else %}
                        Создать
                    {% endif %}
                </button>
                <a class="btn btn-success" href="{% url 'catalog:list_product' %}" role="button">Назад</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
